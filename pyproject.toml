[project]
name = "seoultech-mail-mcp"
version = "0.1.0"
description = "Read-only SeoulTech webmail MCP server and daily inbox digest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "playwright>=1.55,<2",
    "pydantic>=2,<3",
]

[project.scripts]
seoultech-mail-mcp = "seoultech_mcp.server:main"
seoultech-mail = "seoultech_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seoultech_mcp"]
